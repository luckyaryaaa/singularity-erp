<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#162033">
  <meta name="description" content="MAT ERP V2 — ruang kerja operasional Mandiri Abadi Teknik">
  <title>SINGULARITY · Accelerate Your Business</title>
  <link rel="icon" href="icon-logo-gw.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/manrope-latin-variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/plus-jakarta-sans-latin-variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="src/design-system/tokens.css">
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Lewati ke konten utama</a>

  <!-- Lapisan sesi: login tampil sebelum sesi terverifikasi — tanpa flash halaman lama. -->
  <!-- Satu app shell, satu router, satu render engine. -->
  <div class="app" id="app" hidden>
    <aside class="sidebar" id="sidebar" aria-label="Navigasi utama">
      <div class="brand"><span class="brand-mark"><img src="/icon-logo-gw.svg" alt="Singularity"></span><span class="brand-copy"><b>SINGULARITY</b><small>Enterprise Cloud</small></span><i class="brand-edition">4.0</i></div>
      <div class="company-chip" id="companyChip" title="Mandiri Abadi Teknik"><span class="company-avatar" id="companyAvatar">MA</span><span class="company-copy"><b id="companyName">Mandiri Abadi Teknik</b><small id="branchLabel">Head Office · Bekasi</small></span></div>
      <div class="nav-shell">
        <nav class="space-rail" id="spaceRail" aria-label="Enterprise spaces"></nav>
        <section class="context-nav" aria-labelledby="spaceTitle">
          <header class="space-header">
            <span class="space-kicker">ENTERPRISE SPACE</span>
            <div><h2 id="spaceTitle">Ruang Kerja</h2><span id="spaceMenuCount">0 menu</span></div>
            <p id="spaceDescription">Fokus pribadi, keputusan, dan insight lintas fungsi.</p>
          </header>
          <div class="nav-view-tabs" id="navViews" aria-label="Tampilan navigasi">
            <button class="active" type="button" data-nav-view="modules" aria-pressed="true">Modul</button>
            <button type="button" data-nav-view="favorites" aria-pressed="false">Favorit</button>
            <button type="button" data-nav-view="recent" aria-pressed="false">Terbaru</button>
          </div>
          <nav id="nav" aria-label="Menu dalam enterprise space"></nav>
        </section>
      </div>
    </aside>
    <div class="shell">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Ciutkan navigasi" aria-controls="sidebar" aria-expanded="false" title="Ciutkan navigasi">
          <svg class="rail-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16M15 9l-3 3 3 3"/></svg>
        </button>
        <button class="command" id="commandBtn" aria-haspopup="dialog" aria-controls="commandDialog">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <span>Cari modul atau tindakan…</span><kbd>Ctrl K</kbd>
        </button>
        <div class="top-actions">
          <span class="branch"><span class="branch-dot"></span><b id="topBranch">Head Office</b></span>
          <a class="icon-btn has-badge" id="notifBtn" href="#/notifications" aria-label="Notifikasi">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>
            <i id="notifBadge" hidden>0</i>
          </a>
          <div class="account" id="accountChip">
            <button class="account-btn" id="accountBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="accountMenu">
              <span class="account-avatar" id="profileAvatar">–</span>
              <span class="account-copy"><b id="profileName">…</b><small id="profileRole">…</small></span>
              <svg class="account-caret" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="account-menu" id="accountMenu" role="menu" hidden>
              <div class="account-menu-head">
                <span class="account-avatar lg" id="profileAvatarLg">–</span>
                <span class="account-copy"><b id="profileNameLg">…</b><small id="profileRoleLg">…</small></span>
              </div>
              <button class="account-menu-item" id="editProfileBtn" type="button" role="menuitem">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                <span>Edit profil</span>
              </button>
              <button class="account-menu-item" id="changePhotoBtn" type="button" role="menuitem">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2Z"/><circle cx="12" cy="13" r="4"/></svg>
                <span>Ganti foto</span>
              </button>
              <input id="accountPhotoInput" type="file" accept="image/png,image/jpeg,image/webp" hidden>
              <button class="account-menu-item" id="enrollPasskeyBtn" type="button" role="menuitem">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5a5 5 0 0 1 5 5v2a9 9 0 0 1-.6 3.2M8.4 18.5A9 9 0 0 1 7 13.5v-2a5 5 0 0 1 2-4M12 10.5v4M9.6 10a3 3 0 0 1 4.8 0"/></svg>
                <span>Aktifkan Fingerprint / Passkey</span>
              </button>
              <a class="account-menu-item" id="accountSecurityLink" href="#/account/security" role="menuitem">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6Z"/></svg>
                <span>Keamanan akun</span>
              </a>
              <a class="account-menu-item" id="accountBillingLink" href="#/billing" role="menuitem" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16v12H4zM4 10h16M8 15h3"/></svg>
                <span>Langganan &amp; tagihan</span>
              </a>
              <button class="account-menu-item danger" id="logoutBtn" type="button" role="menuitem">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5V3h4M15 16l4-4-4-4M19 12H9"/></svg>
                <span>Keluar</span>
              </button>
            </div>
          </div>
        </div>
      </header>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>

  <!-- Lapisan global: satu scrim, satu drawer, satu modal layer, satu toast. -->
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="drawerTitle">
    <header>
      <div><p class="eyebrow" id="drawerEyebrow">DETAIL</p><h2 id="drawerTitle">Dokumen</h2></div>
      <button class="icon-btn close" id="drawerClose" aria-label="Tutup panel detail">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </header>
    <div id="drawerContent"></div>
  </aside>
  <dialog id="actionDialog"></dialog>
  <dialog id="commandDialog" aria-labelledby="commandTitle">
    <form method="dialog">
      <h2 class="sr-only" id="commandTitle">Cari modul atau tindakan</h2>
      <label><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <span class="sr-only">Cari modul</span><input id="commandInput" placeholder="Ketik nama modul…" autocomplete="off"><kbd>Esc</kbd></label>
      <div class="command-results" id="commandResults"></div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>
    <span><b></b><small></small></span>
  </div>

  <script src="src/i18n.js" defer></script>
  <script src="src/core.js" defer></script>
  <script src="src/components.js" defer></script>
  <script src="src/components/enterprise-table.js" defer></script>
  <script src="src/pages.js" defer></script>
  <script src="src/modules/workspace.js" defer></script>
  <script src="src/modules/documents.js" defer></script>
  <script src="src/modules/sales.js" defer></script>
  <script src="src/modules/procurement.js" defer></script>
  <script src="src/modules/inventory.js" defer></script>
  <script src="src/modules/production.js" defer></script>
  <script src="src/modules/finance.js" defer></script>
  <script src="src/modules/hr.js" defer></script>
  <script src="src/modules/master-data.js" defer></script>
  <script src="src/modules/organization.js" defer></script>
  <script src="src/modules/governance.js" defer></script>
  <script src="src/modules/executive-reporting.js" defer></script>
  <script src="src/modules/my-work.js" defer></script>
  <script src="src/app.js" defer></script>
</body>
</html>
