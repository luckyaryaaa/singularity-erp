<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Singularity · Control Plane</title>
  <link rel="icon" href="/icon-logo-gw.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/platform/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">◆</span> SINGULARITY <span class="brand-sub">Control Plane</span></div>
    <div class="session"><span id="opName" class="op-name">—</span><a class="btn-ghost" href="/">Workspace ERP →</a></div>
  </header>

  <main class="wrap">
    <!-- Access gate: shown when not authenticated / not an operator -->
    <section id="gate" class="gate" hidden>
      <div class="gate-card">
        <div class="gate-icon" id="gateIcon" aria-hidden="true">🔒</div>
        <h1 id="gateTitle">Memeriksa akses…</h1>
        <p id="gateMsg">Menghubungkan ke control plane.</p>
        <a id="gateAction" class="btn btn-primary" href="/login/" hidden>Masuk sebagai operator</a>
      </div>
    </section>

    <!-- Operator console -->
    <section id="console" class="console" hidden>
      <div class="stat-row" id="statRow"></div>

      <div class="panel">
        <div class="panel-head">
          <h2>Tenants</h2>
          <div class="panel-actions">
            <button id="btnRefresh" class="btn" type="button">↻ Refresh</button>
            <button id="btnToggleOnboard" class="btn btn-primary" type="button">+ Onboard tenant</button>
          </div>
        </div>

        <form id="onboardForm" class="onboard" hidden autocomplete="off">
          <div class="onboard-grid">
            <label>Nama perusahaan<input id="obCompany" type="text" required minlength="2" placeholder="PT Contoh Sukses"></label>
            <label>Kode organisasi<input id="obCode" type="text" required pattern="[A-Za-z0-9-]+" placeholder="contoh-sukses"></label>
            <label>Username owner<input id="obUser" type="text" required placeholder="admin"></label>
            <label>Nama tampilan<input id="obDisplay" type="text" placeholder="Nama Owner"></label>
            <label>Kata sandi owner<input id="obPass" type="password" required minlength="12" placeholder="Min 12 char, Aa1@"></label>
            <label>Paket<select id="obPlan"></select></label>
          </div>
          <div class="onboard-foot">
            <button type="submit" class="btn btn-primary">Buat tenant</button>
            <button type="button" id="btnCancelOnboard" class="btn btn-ghost">Batal</button>
          </div>
        </form>

        <div class="table-wrap">
          <table class="tenants">
            <thead><tr><th>Kode</th><th>Nama</th><th>Status</th><th>Isolasi</th><th>Domain</th><th>Dibuat</th><th class="col-act">Aksi</th></tr></thead>
            <tbody id="tenantsBody"><tr><td colspan="7" class="muted">Memuat…</td></tr></tbody>
          </table>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head"><h2>Paket &amp; entitlement</h2></div>
        <div id="plansRow" class="plans-row"></div>
      </div>

      <div class="panel">
        <div class="panel-head"><h2>Audit trail</h2><div class="panel-actions"><button id="btnRefreshAudit" class="btn" type="button">↻ Refresh</button></div></div>
        <div class="table-wrap">
          <table class="tenants audit-table">
            <thead><tr><th>Waktu</th><th>Aksi</th><th>Tenant</th><th>Oleh</th><th>Detail</th></tr></thead>
            <tbody id="auditBody"><tr><td colspan="5" class="muted">Memuat…</td></tr></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <div id="drawerBackdrop" class="drawer-backdrop" hidden></div>
  <aside id="drawer" class="drawer" hidden aria-label="Detail tenant">
    <div class="drawer-head">
      <div><div id="drawerCode" class="drawer-code">—</div><h2 id="drawerName">Tenant</h2></div>
      <button id="drawerClose" class="btn btn-ghost btn-sm" type="button" aria-label="Tutup">✕</button>
    </div>
    <div id="drawerBody" class="drawer-body"><div class="muted">Memuat…</div></div>
  </aside>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/platform/app.js"></script>
</body>
</html>
